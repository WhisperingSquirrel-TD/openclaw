# Human-readable companion: ai-briefing-sources.md
#
# Fields per entry:
#   name     - Display name used in briefing output
#   url      - RSS/Atom feed URL
#   weight   - 0.4–1.0; higher = harder to filter in heuristic pass (see policy)
